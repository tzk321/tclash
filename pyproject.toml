[project]
name = "tclash"
version = "0.1.0"
description = "mihomo 内核的 CLI / TUI 管理器"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pypinyin>=0.55.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "typer>=0.27.3",
]

[project.scripts]
tclash = "tclash.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
